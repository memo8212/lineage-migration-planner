name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Tests
        run: pytest -q tests/

      - name: Scan the sample estate
        run: python -m lineageplanner scan sample_estate --out artifacts

      - name: Show assessment
        run: cat artifacts/assessment.md
