[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineageplanner"
version = "0.1.0"
description = "Build a lineage graph from a legacy estate and plan the Databricks migration"
requires-python = ">=3.9"
dependencies = ["networkx>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
render = ["pygraphviz>=1.11"]
view = ["streamlit>=1.30", "pyvis>=0.3.2"]
dev = ["pytest>=8.0"]

[project.scripts]
lineageplanner = "lineageplanner.cli:main"

[tool.setuptools]
packages = ["lineageplanner", "lineageplanner.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", ".git", "artifacts", "**/artifacts", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F841", "E702", "E741", "F541"]
